<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 270" width="750" height="270" role="img" aria-label="מימוש AND בעזרת NAND ו־NOT"><title>מימוש AND בעזרת NAND ו־NOT</title><style>svg{--ink:#0a1628;--card:#ffffff;--chip:#eef1f6;--border:#c3cddc;--accent:#4361ee;--accent-tint:#eef1fe;--pink:#e0175d;--edge:#64748b;--muted:#718096;}
@media (prefers-color-scheme: dark){svg{--ink:#edf3fc;--card:#0e1f38;--chip:#152a49;--border:#385582;--accent:#7b90f5;--accent-tint:#1a2c55;--pink:#ff5c93;--edge:#8296b3;--muted:#8296b3;}}
.n-box{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
.n-dia{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5;}
.n-hl{fill:var(--card);stroke:var(--pink);stroke-width:2;}
.n-cell{fill:var(--card);stroke:var(--border);stroke-width:1.2;}
.n-code-bg{fill:var(--chip);stroke:var(--border);stroke-width:1.2;}
.t{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:15px;font-weight:500;fill:var(--ink);direction:rtl;}
.t-b{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--ink);direction:rtl;}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;fill:var(--ink);direction:ltr;}
.lbl{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--accent);direction:rtl;}
.small{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:12px;fill:var(--muted);direction:rtl;}
.idx{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;fill:var(--muted);}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none;}
.arrhead{fill:var(--edge);}
text{font-family:Segoe UI,Arial,sans-serif;}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--edge)"/></marker></defs><rect width="750" height="270" rx="16" fill="var(--card)"/><text x="375.0" y="36" text-anchor="middle" direction="rtl" font-size="22" fill="var(--ink)">מימוש AND בעזרת NAND ו־NOT</text>
<text x="50" y="121" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">A</text>
<path d="M70,115 L220,115" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<text x="50" y="161" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">B</text>
<path d="M70,155 L220,155" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<rect x="220" y="103" width="100" height="64" rx="12" fill="var(--accent-tint)" stroke="var(--border)" stroke-width="2"/>
<text x="270.0" y="141.0" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">NAND</text>
<path d="M320,135 L450,135" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="450" y="103" width="100" height="64" rx="12" fill="var(--accent-tint)" stroke="var(--border)" stroke-width="2"/>
<text x="500.0" y="141.0" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">NOT</text>
<path d="M550,135 L660,135" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="700" y="141" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">Q</text>
<text x="375" y="230" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">Q = NOT NAND(A, B) = A AND B</text></svg>

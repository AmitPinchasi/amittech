<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" role="img" aria-label="ציור באמצעות תווי טקסט"><title>ציור באמצעות תווי טקסט</title><style>svg{--ink:#0a1628;--card:#ffffff;--chip:#eef1f6;--border:#c3cddc;--accent:#4361ee;--accent-tint:#eef1fe;--pink:#e0175d;--edge:#64748b;--muted:#718096;}
@media (prefers-color-scheme: dark){svg{--ink:#edf3fc;--card:#0e1f38;--chip:#152a49;--border:#385582;--accent:#7b90f5;--accent-tint:#1a2c55;--pink:#ff5c93;--edge:#8296b3;--muted:#8296b3;}}
.n-box{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
.n-dia{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5;}
.n-hl{fill:var(--card);stroke:var(--pink);stroke-width:2;}
.n-cell{fill:var(--card);stroke:var(--border);stroke-width:1.2;}
.n-code-bg{fill:var(--chip);stroke:var(--border);stroke-width:1.2;}
.t{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:15px;font-weight:500;fill:var(--ink);direction:rtl;}
.t-b{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--ink);direction:rtl;}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;fill:var(--ink);direction:ltr;}
.lbl{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--accent);direction:rtl;}
.small{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:12px;fill:var(--muted);direction:rtl;}
.idx{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;fill:var(--muted);}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none;}
.arrhead{fill:var(--edge);}
text{font-family:Segoe UI,Arial,sans-serif;}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--edge)"/></marker></defs><rect width="660" height="290" rx="16" fill="var(--card)"/><text x="330.0" y="36" text-anchor="middle" direction="rtl" font-size="22" fill="var(--ink)">ציור באמצעות תווי טקסט</text>
<text x="150" y="90" xml:space="preserve" style="font-family:Consolas,monospace;font-size:23px;fill:var(--ink)">       /\</text>
<text x="150" y="120" xml:space="preserve" style="font-family:Consolas,monospace;font-size:23px;fill:var(--ink)">  ____/  \____</text>
<text x="150" y="150" xml:space="preserve" style="font-family:Consolas,monospace;font-size:23px;fill:var(--ink)"> /   o       /</text>
<text x="150" y="180" xml:space="preserve" style="font-family:Consolas,monospace;font-size:23px;fill:var(--ink)">&lt;           &lt;</text>
<text x="150" y="210" xml:space="preserve" style="font-family:Consolas,monospace;font-size:23px;fill:var(--ink)"> \__________\</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" width="900" height="418" role="img" aria-label="אימות NTLM - חילופי ההודעות"><title>אימות NTLM - חילופי ההודעות</title><style>svg{--ink:#0a1628;--card:#ffffff;--chip:#eef1f6;--border:#c3cddc;--accent:#4361ee;--accent-tint:#eef1fe;--pink:#e0175d;--edge:#64748b;--muted:#718096;}
@media (prefers-color-scheme: dark){svg{--ink:#edf3fc;--card:#0e1f38;--chip:#152a49;--border:#385582;--accent:#7b90f5;--accent-tint:#1a2c55;--pink:#ff5c93;--edge:#8296b3;--muted:#8296b3;}}
.n-box{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
.n-dia{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5;}
.n-hl{fill:var(--card);stroke:var(--pink);stroke-width:2;}
.n-cell{fill:var(--card);stroke:var(--border);stroke-width:1.2;}
.n-code-bg{fill:var(--chip);stroke:var(--border);stroke-width:1.2;}
.t{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:15px;font-weight:500;fill:var(--ink);direction:rtl;}
.t-b{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--ink);direction:rtl;}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;fill:var(--ink);direction:ltr;}
.lbl{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--accent);direction:rtl;}
.small{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:12px;fill:var(--muted);direction:rtl;}
.idx{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;fill:var(--muted);}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none;}
.arrhead{fill:var(--edge);}
text{font-family:Segoe UI,Arial,sans-serif;}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--edge)"/></marker></defs><rect width="900" height="418" rx="16" fill="var(--card)"/><text x="450.0" y="36" text-anchor="middle" direction="rtl" font-size="22" fill="var(--ink)">אימות NTLM - חילופי ההודעות</text>
<rect x="22.0" y="65" width="176" height="46" rx="12" fill="var(--chip)" stroke="var(--border)" stroke-width="2"/>
<text x="110.0" y="94.0" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">Client</text>
<path d="M110.0,115 L110.0,348" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<rect x="702.0" y="65" width="176" height="46" rx="12" fill="var(--chip)" stroke="var(--border)" stroke-width="2"/>
<text x="790.0" y="94.0" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">Server</text>
<path d="M790.0,115 L790.0,348" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<text x="450.0" y="145" text-anchor="middle" direction="ltr" font-size="15" fill="var(--ink)">1  NEGOTIATE</text>
<path d="M110.0,157 L790.0,157" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450.0" y="221" text-anchor="middle" direction="ltr" font-size="15" fill="var(--ink)">2  CHALLENGE</text>
<path d="M790.0,233 L110.0,233" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450.0" y="297" text-anchor="middle" direction="ltr" font-size="15" fill="var(--ink)">3  AUTHENTICATE</text>
<path d="M110.0,309 L790.0,309" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="450.0" y="394" text-anchor="middle" direction="rtl" font-size="15" fill="var(--ink)">הלקוח מחשב תגובה לאתגר באמצעות פרטי האימות שלו</text></svg>

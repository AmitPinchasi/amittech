  - tables
  # Math rendering. "$...$" and "$$...$$" are the delimiters Obsidian renders
  # natively, so notes look the same in the vault and on the site. "\( \)" and
  # "\[ \]" are accepted too. smart_dollar keeps shell variables and prices
  # ("$PATH", "$100") from being parsed as math - all 2761 existing pages were
  # scanned and only the MIPS register table needed adjusting.
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
      inline_syntax:
        - dollar
        - round
      block_syntax:
        - dollar
        - square
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/themes.css

extra_javascript:
  - javascripts/progress.js
  - javascripts/tabs-dropdown.js
  - javascripts/theme-switcher.js
  - javascripts/recent-posts.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

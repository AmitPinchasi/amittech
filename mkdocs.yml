site_name: עמית טק
site_url: https://amittech.dev/
site_description: קורסי סייבר, תכנות, IT ומחשבים בחינם בעברית - מעל 2000 שעות לימוד עם תרגול מעשי. מתאים למתחילים ולמתקדמים.
site_author: עמית פנחסי
docs_dir: docs
site_dir: site

hooks:
  - hooks/cache_bust_assets.py
  - hooks/build_stamp.py
  - hooks/sort_lesson_pages.py
  - hooks/build_nav_categories.py
  - hooks/build_recent_posts.py
  - hooks/related_posts.py
  - hooks/auto_meta_description.py
  - hooks/auto_page_title.py
  - hooks/paginated_blog_titles.py
  - hooks/image_dimensions.py
  - hooks/trim_search_index.py

theme:
  name: material
  custom_dir: docs/overrides
  logo: amittech.png
  favicon: favicon.ico
  direction: rtl
  language: he
  font:
    text: Heebo
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - navigation.path
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: he
  - roamlinks
  - awesome-pages:
      order: asc
      sort_type: natural
  - exclude:
      glob:
        - "*.pdf"
  - blog:
      blog_dir: blog
      post_date_format: long
      archive_date_format: yyyy
      post_url_format: "{date}/{slug}"
      archive: true
      categories: false
  - tags:
      tags_file: tags.md
  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - tags
  - social
  - optimize
  - git-revision-date-localized:
      type: iso_datetime
      timezone: UTC
      fallback_to_build_date: true

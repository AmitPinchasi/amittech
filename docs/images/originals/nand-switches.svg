<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 470" width="750" height="470" role="img" aria-label="מודל מפסקים לשער NAND"><title>מודל מפסקים לשער NAND</title><style>svg{--ink:#0a1628;--card:#ffffff;--chip:#eef1f6;--border:#c3cddc;--accent:#4361ee;--accent-tint:#eef1fe;--pink:#e0175d;--edge:#64748b;--muted:#718096;}
@media (prefers-color-scheme: dark){svg{--ink:#edf3fc;--card:#0e1f38;--chip:#152a49;--border:#385582;--accent:#7b90f5;--accent-tint:#1a2c55;--pink:#ff5c93;--edge:#8296b3;--muted:#8296b3;}}
.n-box{fill:var(--card);stroke:var(--border);stroke-width:1.5;}
.n-dia{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.5;}
.n-hl{fill:var(--card);stroke:var(--pink);stroke-width:2;}
.n-cell{fill:var(--card);stroke:var(--border);stroke-width:1.2;}
.n-code-bg{fill:var(--chip);stroke:var(--border);stroke-width:1.2;}
.t{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:15px;font-weight:500;fill:var(--ink);direction:rtl;}
.t-b{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:16px;font-weight:700;fill:var(--ink);direction:rtl;}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;fill:var(--ink);direction:ltr;}
.lbl{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:13px;font-weight:600;fill:var(--accent);direction:rtl;}
.small{font-family:'Heebo','Segoe UI',system-ui,sans-serif;font-size:12px;fill:var(--muted);direction:rtl;}
.idx{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;fill:var(--muted);}
.edge{stroke:var(--edge);stroke-width:1.6;fill:none;}
.arrhead{fill:var(--edge);}
text{font-family:Segoe UI,Arial,sans-serif;}
</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--edge)"/></marker></defs><rect width="750" height="470" rx="16" fill="var(--card)"/><text x="375.0" y="36" text-anchor="middle" direction="rtl" font-size="22" fill="var(--ink)">מודל מפסקים לשער NAND</text>
<text x="250" y="85" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">+V</text>
<path d="M250,100 L250,130" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<rect x="225" y="130" width="50" height="80" rx="12" fill="var(--chip)" stroke="var(--border)" stroke-width="2"/>
<text x="250.0" y="176.0" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">R</text>
<path d="M250,210 L250,255" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<path d="M250,230 L520,230" fill="none" stroke="var(--edge)" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="560" y="236" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">Q</text>
<circle cx="250" cy="255" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="261" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)"></text>
<circle cx="250" cy="300" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="306" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)"></text>
<path d="M250,255 L285,290" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<text x="320" y="283" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">A</text>
<circle cx="250" cy="340" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="346" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)"></text>
<circle cx="250" cy="385" r="4" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="2"/>
<text x="250" y="391" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)"></text>
<path d="M250,340 L285,375" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<text x="320" y="368" text-anchor="middle" direction="ltr" font-size="17" fill="var(--ink)">B</text>
<path d="M250,300 L250,340" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<path d="M250,385 L250,410" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<path d="M225,410 L275,410" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<path d="M235,419 L265,419" fill="none" stroke="var(--edge)" stroke-width="2.5"/>
<text x="500" y="330" text-anchor="middle" direction="rtl" font-size="16" fill="var(--ink)">שני מפסקים סגורים מורידים את Q לאפס</text></svg>
